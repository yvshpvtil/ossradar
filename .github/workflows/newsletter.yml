name: Daily newsletter

on:
  schedule:
    # Target 02:45 UTC = 08:15 IST (GitHub often starts scheduled jobs 15-60+ min late),
    # with a backup at 04:30 UTC = 10:00 IST. The script skips if today's broadcast already exists.
    - cron: "45 2 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not send"
        type: boolean
        default: true

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build and send
        run: npx tsx scripts/newsletter.ts
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scheduled runs send; manual runs default to dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: newsletter
          path: out/newsletter.html
