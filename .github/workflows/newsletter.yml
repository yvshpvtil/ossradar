name: Daily newsletter

on:
  schedule:
    # Target 13:30 UTC = 19:00 IST / 09:30 US Eastern (EDT) / 15:30 CEST (GitHub often starts
    # scheduled jobs 15-60+ min late), with a backup at 15:15 UTC = 20:45 IST. The script sends at
    # most one broadcast per UTC data date and skips if today's broadcast already exists or the
    # data isn't from today (UTC).
    # Early runs at 11:00 and 12:00 UTC build the issue and schedule it in Kit for 13:30 UTC, so
    # GitHub's delayed/dropped schedules (7h late on Nov 13 2026) don't delay the send.
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "30 13 * * *"
    - cron: "15 15 * * *"
  # Also run after every hourly data collect: workflow_run triggers fire within minutes, unlike
  # GitHub's cron schedules (Nov 14 2026: every newsletter cron fired 4.5-6h late, send went at
  # 16:54 UTC). Before the target these schedule (or refresh) the 13:30 UTC Kit broadcast.
  workflow_run:
    workflows: ["Hourly data collection"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not send"
        type: boolean
        default: true

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest main, so a run chained to the hourly collect sees its data commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build and send
        run: npx tsx scripts/newsletter.ts
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scheduled runs send; manual runs default to dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          # Chained runs don't start a brand-new send after 15:00 UTC; the cron backups cover that.
          LATEST_NEW_SEND_UTC: ${{ github.event_name == 'workflow_run' && '15:00' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: newsletter
          path: out/newsletter.html
