name: Daily newsletter

on:
  schedule:
    # Target 13:30 UTC = 19:00 IST / 09:30 US Eastern (EDT) / 15:30 CEST (GitHub often starts
    # scheduled jobs 15-60+ min late), with a backup at 15:15 UTC = 20:45 IST. The script sends at
    # most one broadcast per UTC data date and skips if today's broadcast already exists or the
    # data isn't from today (UTC).
    - cron: "30 13 * * *"
    - cron: "15 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not send"
        type: boolean
        default: true

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build and send
        run: npx tsx scripts/newsletter.ts
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scheduled runs send; manual runs default to dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: newsletter
          path: out/newsletter.html
