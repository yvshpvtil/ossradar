name: Deploy to Cloudflare Workers

# Builds the site with @opennextjs/cloudflare and deploys the `ossradar` Worker.
#
# OFF until the repo variable CLOUDFLARE_DEPLOY_ENABLED is set to "true"
# (Settings -> Secrets and variables -> Actions -> Variables). Until then every run is skipped.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#
# Triggers:
# - push to main (code changes)
# - after "Hourly data collection" finishes: its data commit is pushed with GITHUB_TOKEN,
#   which does not trigger `push` workflows, so redeploy explicitly to publish the new data
#   (pages are prerendered and served from the static-assets cache, so new data = new deploy)
# - manual run
# push/workflow_run only fire for workflows that exist on the default branch, so nothing
# here runs before this file is merged to main.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Hourly data collection"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest main, so a deploy after the hourly run includes its data commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (OpenNext for Cloudflare + prerendered OG cards)
        run: npm run cf:build

      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker runtime secrets come from the repo's Actions secrets (single source of truth;
      # Vercel's copies are "sensitive" and can't be exported). Only on code pushes / manual runs,
      # not every hourly data deploy. Empty secrets are skipped.
      - name: Sync Worker runtime secrets
        if: github.event_name != 'workflow_run'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_FORM_ID: ${{ secrets.KIT_FORM_ID }}
          KIT_V3_API_KEY: ${{ secrets.KIT_V3_API_KEY }}
          KIT_WELCOME_SEQUENCE_ID: ${{ secrets.KIT_WELCOME_SEQUENCE_ID }}
        run: |
          node -e 'const ks=["KIT_API_KEY","KIT_FORM_ID","KIT_V3_API_KEY","KIT_WELCOME_SEQUENCE_ID"];const o={};for(const k of ks)if(process.env[k])o[k]=process.env[k];require("fs").writeFileSync(process.env.RUNNER_TEMP+"/secrets.json",JSON.stringify(o));console.log("syncing",Object.keys(o).join(", "))'
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"

      # The data commit is live as soon as the deploy above finishes (it triggers off the
      # hourly workflow), so ping IndexNow here instead of guessing a deploy time in daily.yml.
      - name: IndexNow ping
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sleep 30
          # Skip while the apex still points at a dead Vercel deploy (402); IndexNow
          # submits https://ossradar.net/... URLs and would only teach engines those 402s.
          code=$(curl -sI -o /dev/null -w "%{http_code}" https://ossradar.net/ || echo "000")
          if [[ "$code" =~ ^2 ]]; then
            npx tsx scripts/indexnow.ts
          else
            echo "IndexNow skipped: ossradar.net not healthy (HTTP $code)"
            exit 0
          fi
